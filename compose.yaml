# Obsidian work/life log: headless Obsidian Sync + activity fetchers.
# All network traffic is outbound (Obsidian Sync, GitHub, Linear), so no
# Tailscale sidecar or published ports are needed.

x-common: &common
  # Prebuilt by .github/workflows/image.yml. To build on the mini instead:
  # IMAGE=obsidian-worklog:local docker compose build
  image: ${IMAGE:-ghcr.io/YOUR_GITHUB_USER/obsidian-worklog:latest}
  build: .
  pull_policy: missing
  restart: unless-stopped
  user: "${PUID:-1000}:${PGID:-1000}"
  environment:
    TZ: ${TZ:-America/Los_Angeles}
    XDG_CONFIG_HOME: /config   # where `ob` keeps its login + vault sync state
    VAULT_PATH: /vault
  volumes:
    - ./data/vault:/vault
    - ./data/config:/config

services:
  sync:
    <<: *common
    command: ["ob", "sync", "--path", "/vault", "--continuous"]

  worker:
    <<: *common
    env_file: .env
    volumes:
      - ./data/vault:/vault
      - ./config.json:/app/config.json:ro
    command: ["sh", "/app/scripts/loop.sh"]
    depends_on: [sync]
